<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIKR Clone — PT Barito Pacific Tbk (IDX: BRPT)</title>
<style>
:root{
  --bg:#0e1116; --panel:#161b22; --panel2:#1c232c; --border:#2a323d;
  --text:#e6edf3; --muted:#8b98a5; --accent:#2f81f7; --accent-soft:rgba(47,129,247,.14);
  --green:#3fb950; --red:#f85149; --gold:#d29922;
  --shadow:0 2px 8px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
/* ===== Layout ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0a0d12;border-right:1px solid var(--border);position:fixed;top:0;bottom:0;display:flex;flex-direction:column;z-index:50}
.logo{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border)}
.logo .mark{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#2f81f7,#79b8ff);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}
.logo .name{font-weight:800;color:#fff;font-size:17px;letter-spacing:.02em}
.logo .name small{display:block;font-size:10px;font-weight:500;color:var(--muted)}
.side-search{margin:12px 12px 6px;position:relative}
.side-search input{width:100%;padding:8px 10px 8px 30px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;outline:none}
.side-search input:focus{border-color:var(--accent)}
.side-search .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px}
.side-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#5a6572;padding:12px 18px 6px;font-weight:700}
.co-list{flex:1;overflow-y:auto;padding:0 8px}
.co-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;cursor:pointer;position:relative}
.co-item:hover{background:var(--panel)}
.co-item.active{background:var(--accent-soft)}
.co-item .sym{font-weight:800;color:var(--accent);width:56px;font-size:13px}
.co-item .nm{flex:1;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co-item .px{font-size:12px;font-weight:600}
.co-item .del{opacity:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px 4px}
.co-item:hover .del{opacity:1}
.co-item .del:hover{color:var(--red)}
.add-wrap{padding:10px 12px;border-top:1px solid var(--border)}
.add-btn{width:100%;padding:10px;border:1px dashed #3a4450;background:transparent;color:var(--text);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.side-foot{padding:10px 16px;font-size:10.5px;color:#5a6572;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.side-foot a{color:var(--accent);cursor:pointer;text-decoration:none}
.main{margin-left:250px;flex:1;min-width:0}
/* ===== Ticker header ===== */
.tk-head{padding:20px 28px 0;border-bottom:1px solid var(--border);background:linear-gradient(180deg,#131922,#0e1116)}
.tk-line1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tk-sym{font-size:26px;font-weight:800}
.badge{font-size:11px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:3px 9px;border-radius:5px;font-weight:600}
.badge.blue{color:var(--accent);border-color:rgba(47,129,247,.4)}
.tk-price-row{display:flex;align-items:baseline;gap:14px;margin-top:6px}
.big-price{font-size:30px;font-weight:800;letter-spacing:-.5px}
.chg{font-size:15px;font-weight:700}
.pos{color:var(--green)} .neg{color:var(--red)} .flat{color:var(--muted)}
.tk-desc{color:var(--muted);font-size:12.5px;margin-top:4px;max-width:760px}
.tabs{display:flex;gap:2px;margin-top:16px}
.tab{padding:11px 18px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;font-size:13.5px}
.tab:hover{color:var(--text)}
.tab.active{color:#fff;border-color:var(--accent)}
.content{padding:22px 28px;max-width:1240px}
/* ===== Cards & tables ===== */
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:18px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card-h h3{font-size:14.5px}
.card-b{padding:18px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{text-align:right;padding:9px 12px;color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{text-align:left}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}
tbody td:first-child{text-align:left}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.025)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:3px}
.seg button{padding:5px 14px;background:transparent;border:none;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;border-radius:6px}
.seg button.on{background:var(--accent);color:#fff}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.stat .v{font-size:16px;font-weight:700;margin-top:3px}
canvas.chart{width:100%;height:320px;display:block;border-radius:8px}
.range-btns{display:inline-flex;gap:4px}
.range-btns button{padding:5px 12px;background:var(--panel2);border:1px solid var(--border);color:var(--muted);border-radius:6px;font-size:12px;cursor:pointer;font-weight:600}
.range-btns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* ===== Valuation ===== */
.val-grid{display:grid;grid-template-columns:300px 1fr;gap:18px}
@media(max-width:980px){.val-grid{grid-template-columns:1fr}}
.field{margin-bottom:14px}
.field label{font-size:12px;font-weight:600;color:var(--muted);display:block}
.field input{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;margin-top:4px;background:var(--panel2);color:var(--text)}
.field input:focus{outline:none;border-color:var(--accent)}
.fv-box{background:linear-gradient(135deg,#1a3a6b,#2f81f722);border:1px solid rgba(47,129,247,.35);border-radius:10px;padding:20px}
.fv-box .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.fv-box .v{font-size:30px;font-weight:800;margin:6px 0}
.verdict{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:700;font-size:12.5px}
.verdict.under{background:var(--green);color:#0b1a0e}
.verdict.over{background:var(--red);color:#fff}
/* ===== Peers ===== */
.peer-chip{display:inline-flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin:0 8px 8px 0}
.peer-chip .sym{font-weight:800;color:var(--accent)}
.peer-chip button{background:var(--accent);border:none;color:#fff;border-radius:5px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:600}
/* ===== Modal ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:40px 20px;overflow:auto}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;width:520px;max-width:100%;box-shadow:var(--shadow)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:15px}
.modal-h .x{cursor:pointer;color:var(--muted);font-size:18px;padding:0 4px}
.modal-b{padding:20px}
.modal-b .field input,.modal-b .field select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--panel2);color:var(--text);margin-top:4px}
.modal-b .field input:focus,.modal-b .field select:focus{outline:none;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-f{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.btn{padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel2);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1f6fe0}
.btn.danger{color:var(--red);border-color:rgba(248,81,73,.4)}
.hint{font-size:11px;color:var(--muted);margin-top:3px}
.empty-state{padding:80px 20px;text-align:center;color:var(--muted)}
.empty-state .big{font-size:44px;margin-bottom:12px}
.pill{display:inline-block;padding:2px 9px;border-radius:12px;font-size:11px;font-weight:700}
.pill.g{background:rgba(63,185,80,.15);color:var(--green)}
.pill.r{background:rgba(248,81,73,.15);color:var(--red)}
.pill.y{background:rgba(210,153,34,.15);color:var(--gold)}
.live-badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;border:1px solid var(--border);color:var(--muted);cursor:default;user-select:none}
.live-badge.live{color:var(--green);border-color:rgba(63,185,80,.5)}
.live-badge.off{color:var(--red);border-color:rgba(248,81,73,.5)}
.live-refresh{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;margin-left:6px}
.live-refresh:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar">
    <div class="logo">
      <div class="mark">T</div>
      <div class="name">TIKR<small>Clone · Indonesia</small></div>
    </div>
    <div class="side-search">
      <span class="ico">🔎</span>
      <input id="co-search" placeholder="Cari perusahaan..." autocomplete="off">
    </div>
    <div class="side-label">Perusahaan</div>
    <div class="co-list" id="co-list"></div>
    <div class="add-wrap"><button class="add-btn" onclick="openAddModal()">＋ Tambah Saham</button></div>
    <div class="side-foot"><span>Data dummy — demo tugas</span><a onclick="resetData()">Reset</a></div>
  </aside>

  <!-- ===== Main ===== -->
  <div class="main">
    <div id="tk-head"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ===== Modal Tambah Saham ===== -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <div class="modal-h"><h3 id="modal-title">Tambah Saham</h3><span class="x" onclick="closeModal()">✕</span></div>
    <div class="modal-b">
      <div class="frow">
        <div class="field"><label>Ticker (wajib)</label><input id="f-tk" placeholder="mis. TPIA" maxlength="8"></div>
        <div class="field"><label>Nama Perusahaan</label><input id="f-nm" placeholder="mis. Chandra Asri Pacific"></div>
      </div>
      <div class="frow">
        <div class="field"><label>Sektor</label>
          <select id="f-sector">
            <option>Energi & Petrokimia</option><option>Perbankan & Jasa Keuangan</option>
            <option>Telekomunikasi</option><option>Infrastruktur & Energi Terbarukan</option>
            <option>Barang Konsumer</option><option>Properti & Real Estat</option>
            <option>Tambang & Logam</option><option>Transportasi & Logistik</option>
            <option>Kesehatan</option><option>Teknologi</option>
          </select>
        </div>
        <div class="field"><label>Harga Saham (Rp)</label><input id="f-price" type="number" placeholder="mis. 7500"></div>
      </div>
      <div class="frow">
        <div class="field"><label>Market Cap (Rp triliun)</label><input id="f-mcap" type="number" step="0.1" placeholder="mis. 75.4"></div>
        <div class="field"><label>Dividend Yield (%)</label><input id="f-div" type="number" step="0.01" placeholder="mis. 1.2"></div>
      </div>
      <div class="frow">
        <div class="field"><label>Revenue FY terakhir (Rp triliun)</label><input id="f-rev" type="number" step="0.1" placeholder="mis. 12.5"></div>
        <div class="field"><label>Net Margin (%)</label><input id="f-margin" type="number" step="0.1" placeholder="mis. 8"></div>
      </div>
      <div class="frow">
        <div class="field"><label>Revenue CAGR 5 thn (%)</label><input id="f-cagr" type="number" step="0.1" placeholder="mis. 7.5"><div class="hint">Dipakai untuk generate financials historis & forecast</div></div>
        <div class="field"><label>Beta</label><input id="f-beta" type="number" step="0.01" placeholder="mis. 1.1"></div>
      </div>
      <div class="hint" style="margin-top:10px">💡 Isi ticker & harga minimal. Sisanya bisa dikosongkan — sistem akan mengestimasi data yang tidak diisi.</div>
    </div>
    <div class="modal-f">
      <button class="btn" onclick="closeModal()">Batal</button>
      <button class="btn primary" onclick="saveNewStock()">Simpan Saham</button>
    </div>
  </div>
</div>

<script>
/* =========================================================
   DATA STORE (localStorage)
   ========================================================= */
const STORE_KEY="tikr_stocks_v2";
const SEED=[{
  tk:"BRPT", nm:"PT Barito Pacific Tbk", ex:"IDX", sector:"Energi & Petrokimia",
  price:675, chg:0, mcap:63.25, div:null, beta:1.35, betaNote:"asumsi model",
  pe:25.97, peNote:"trailing (3rd party)", ev:"Rp 232.2 T", evNote:"3rd party, belum rekonsiliasi",
  fx:16500,
  desc:"Holding investasi dengan tiga segment utama: <b>Petrochemical & Refinery</b> (Chandra Asri — perimeter berubah sejak akuisisi FY2025), <b>Energy & Resources</b> (energi terbarukan/geotermal), dan <b>Property</b>. FY2025 mencatat bargain purchase gain US$1.868 jt yang non-recurring. 9M2026 (unaudited): revenue US$8.694 jt, EBITDA US$1.405 jt, NPAT US$616 jt. Laporan keuangan disajikan dalam US$ (audited FY2023–FY2025).",
  shares:93.709, // miliar lembar
  nineM:{rev:8694,ebitda:1405,npat:616}, // US$ jt, 9M2026 unaudited
  fin:{ // AS REPORTED — US$ juta, dari FS audited FY2023–FY2025 (workbook tervalidasi)
    currency:"USD", asReal:true, years:[2023,2024,2025],
    rev:[2760.4,2387.0,7630.7],
    gp:[558.1,518.8,null],
    da:[195.8,208.6,308.9],
    fincost:[-322.2,-349.8,-429.4],
    pbt:[223.2,232.7,1603.0],
    bargain:[0,0,1868.0],
    ni:[99.8,122.9,1615.6],
    niOwners:[26.1,56.5,489.8],
    nci:[73.7,66.4,1125.8],
    eps:[0.00028,0.0006,0.00523],
    cash:[1800.2,1606.8,3007.1],
    assets:[10149.7,10532.6,17353.2],
    liab:[6037.7,6344.6,11307.6],
    eqOwners:[1688.4,null,2243.4],
    eqNci:[2423.5,null,3802.2],
    eqTot:[4111.9,4088.0,6045.6],
    debt:[4272.2,null,null], // komponen utang FY24/FY25 belum lengkap (data gap)
    ocf:[140.5,-110.2,309.6],
    capex:[-114.7,-482.4,-877.3],
    fcf:[2.6,-592.6,-567.7],
    divpaid:[-10.0,-5.0,null],
    note:"FY2025 perimeter berubah karena akuisisi/konsolidasi; bargain purchase gain US$1.868 jt non-recurring. Komponen utang FY24/FY25 & EBITDA bridge masih data gap di workbook sumber.",
    flagPerimeter:true
  },
  segments:{years:[2023,2024,2025],
    items:[{nm:"Petrochemical (& Refinery)",rev:[2082.2,1684.5,7020.0],color:"#2f81f7"},
           {nm:"Energy & Resources",rev:[666.2,647.4,605.2],color:"#3fb950"},
           {nm:"Property",rev:[4.8,4.5,5.2],color:"#d29922"},
           {nm:"Others",rev:[7.2,50.6,0.3],color:"#8b98a5"}]},
  fc:{ // FORECAST MODEL (dari workbook valuasi) — US$ juta
    currency:"USD", years:[2026,2027,2028,2029],
    rev:[7865.7,8108.0,8357.8,8615.4],
    ebitda:[961.8,995.2,1029.8,1065.6],
    fcff:[179.6,194.1,209.3,225.0],
    note:"Berdasarkan asumsi segment dari workbook valuasi (petrochem +3%, margin 7%; energy +4%, margin 72%; dsb.) — belum di-roll dari aktual 9M2026."
  },
  valModel:{
    dcfFv:93.09, relFv:730.33, sotpFv:-0.04, blendedFv:205.83, upsideBlended:-69.5,
    weights:"DCF 25% · Relative 25% · SOTP 50%",
    wacc:[["Petrochemical & Refinery",11.2],["Energy & Resources",9.9],["Property",10.7],["Other",11.6]],
    scenarios:[{nm:"Bear",fv:90.44,up:-86.6,note:"petro growth −5%, margin 3%"},
               {nm:"Base",fv:876.82,up:29.9,note:"petro growth +3%, margin 7%"},
               {nm:"Bull",fv:2228.10,up:230.1,note:"petro growth +8%, margin 11%"}],
    warnings:["NCI memakai book-value proxy (US$3.802 jt)","Net debt override = 0 (komponen utang FY24/FY25 belum lengkap)","Listed investments & ownership mapping masih placeholder","EBITDA bridge belum terekonsiliasi"]
  },
  peerBench:[ // Comparable companies dari workbook (multiple referensi)
    {nm:"PTT Global Chemical",tk:"PTTGC TB",evebitda:8.1,pe:null,pb:null,seg:"Petrochem (Thailand)"},
    {nm:"SCG Chemicals",tk:"SCGC TB",evebitda:8.0,pe:null,pb:null,seg:"Petrochem (Thailand)"},
    {nm:"Lotte Chemical Titan",tk:"LCT MK",evebitda:5.5,pe:null,pb:null,seg:"Petrochem (Malaysia)"},
    {nm:"Star Petroleum Refining",tk:"SPRC TB",evebitda:4.6,pe:null,pb:null,seg:"Refinery (Thailand)"},
    {nm:"AKR Corporindo",tk:"AKRA IJ",evebitda:5.2,pe:null,pb:null,seg:"Distribusi/infrastruktur (ID)"},
    {nm:"Pertamina Geothermal Energy",tk:"PGEO IJ",evebitda:8.5,pe:27.6,pb:2.0,seg:"Geotermal (ID)"},
    {nm:"Petronas Gas",tk:"PTG MK",evebitda:9.7,pe:18.1,pb:2.5,seg:"Utilitas gas (MY)"},
    {nm:"PGN",tk:"PGAS IJ",evebitda:1.7,pe:8.7,pb:0.9,seg:"Gas (ID)"},

  peers:[{tk:"TPIA",nm:"Chandra Asri Pacific",sector:"Energi & Petrokimia",added:false},
         {tk:"BREN",nm:"Barito Renewables Energy",sector:"Infrastruktur & Energi Terbarukan",added:false}]

let CO=[]; // daftar perusahaan aktif
try{CO=JSON.parse(localStorage.getItem(STORE_KEY)||"null")||null}catch(e){}
if(!CO||!CO.length){CO=JSON.parse(JSON.stringify(SEED));persist()}
function persist(){localStorage.setItem(STORE_KEY,JSON.stringify(CO))}
function resetData(){if(confirm("Reset semua data ke kondisi awal (hanya BRPT)?")){CO=JSON.parse(JSON.stringify(SEED));persist();selectCo(CO[0].tk)}}

/* =========================================================
   HELPERS
   ========================================================= */
function rp(v,dec=0){return "Rp "+v.toLocaleString("id-ID",{minimumFractionDigits:dec,maximumFractionDigits:dec})}
function rpT(v){return "Rp "+v.toLocaleString("id-ID",{minimumFractionDigits:1,maximumFractionDigits:1})+" T"}
function fmtFin(c,v){ // nilai financial sesuai mata uang laporan
  if(v==null||isNaN(v))return "—";
  if(c.fin.currency==="USD")return "US$"+v.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+" jt";
  return rpT(v);
}
function fmtFc(c,v){ // nilai forecast
  if(v==null||isNaN(v))return "—";
  if(c.fc&&c.fc.currency==="USD")return "US$"+v.toLocaleString("en-US",{minimumFractionDigits:1,maximumFractionDigits:1})+" jt";
  return rpT(v);
}
function fmtEps(c,v){
  if(v==null||isNaN(v))return "—";
  if(c.fin.currency==="USD")return "US$"+(Math.abs(v)<0.01?v.toFixed(5):v.toFixed(2));
  return rp(v,0);
}
function fmtPct(v){return (v>0?"+":"")+v.toFixed(2)+"%"}
function cls(v){return v>0?"pos":(v<0?"neg":"flat")}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=1779033703;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function history(co,days=252){
  const rnd=mulberry32(hashStr(co.tk));
  let p=co.price,out=[];
  for(let i=0;i<days;i++){const step=(rnd()-0.48)*0.028+((co.chg||0)/200);p=p*(1+step);out.push(p)}
  const f=co.price/out[out.length-1];
  return out.map(v=>v*f);
}
function derive(c){ // nilai turunan — mata uang laporan aware
  const f=c.fin,L=f.years.length-1;
  const sharesB=c.shares||(c.mcap*1e12/c.price)/1e9;
  const epsLast=f.eps?f.eps[L]:(f.niOwners&&f.niOwners[L]!=null?f.niOwners[L]*1e6/(sharesB*1e9):(f.currency==="IDR"?f.ni[L]*1e12/(sharesB*1e9):null));
  const pe=c.pe||(epsLast&&f.currency==="IDR"?c.price/epsLast:null);
  const eqTot=f.assets[L]-f.liab[L];
  const pb=f.currency==="IDR"?c.mcap/eqTot:(c.pb||null);
  const evEbitda=(f.currency==="IDR"&&f.ebitda&&f.debt&&f.debt[L]!=null)?((c.mcap+f.debt[L]-f.cash[L])/f.ebitda[L]):(c.evEbitda||null);
  const roe=f.ni&&f.ni[L]!=null?(f.ni[L]/eqTot)*100:null;
  const der=f.liab[L]/eqTot;
  const revG=f.flagPerimeter?null:((f.rev[L]/f.rev[0]-1)/L*100);
  return {sharesB,epsLast,pe,pb,evEbitda,roe,der,revG,eqTot,L};
}

   LIVE PRICE (Yahoo Finance, multi-fallback)
   ========================================================= */
function roundTick(v){ // pembulatan sesuai tick size BEI
  const t=v<200?1:v<500?2:v<2000?5:v<5000?10:25;
  return Math.round(v/t)*t;
}
function yTicker(tk){return tk.includes(".")?tk:tk+".JK"}
async function fetchYahoo(tk){
  const ytk=yTicker(tk);
  const target=`https://query1.finance.yahoo.com/v8/finance/chart/${ytk}?range=1y&interval=1d`;
  const attempts=[target,
    "https://corsproxy.io/?url="+encodeURIComponent(target),
    "https://api.allorigins.win/raw?url="+encodeURIComponent(target)];
  for(const u of attempts){
    try{
      const ctrl=new AbortController();const to=setTimeout(()=>ctrl.abort(),8000);
      const r=await fetch(u,{signal:ctrl.signal});clearTimeout(to);
      if(!r.ok)continue;
      const j=await r.json();
      const res=j.chart&&j.chart.result&&j.chart.result[0];
      if(!res||!res.meta||!res.meta.regularMarketPrice)continue;
      const m=res.meta;
      const price=m.regularMarketPrice;
      const prev=m.chartPreviousClose||m.previousClose||price;
      const q=res.indicators&&res.indicators.quote&&res.indicators.quote[0];
      let closes=(q&&q.close||[]).filter(v=>v!=null);
      if(closes.length&&Math.abs(closes[closes.length-1]-price)>price*0.005)closes.push(price);
      if(!closes.length)closes=[prev,price];
      return {price,prev,closes,ts:res.timestamp||[]};
    }catch(e){/* coba attempt berikutnya */}
  }
  return null;
}

function getSeries(co,days){
  let vals,ts=[];
  if(co.live&&co.live.closes&&co.live.closes.length>=10){
    vals=co.live.closes.slice(-days);
    ts=(co.live.ts||[]).slice(-days);
  }else{
    vals=history(co,days);
  }
  const now=Date.now(),dayMs=86400000;
  while(ts.length<vals.length)ts.push(0);
  for(let i=0;i<ts.length;i++){if(!ts[i])ts[i]=now-(vals.length-1-i)*dayMs}
  return {vals,ts};
}
function drawChart(){
  const cv=document.getElementById("pchart");if(!cv)return;
  const days={"1M":21,"3M":63,"6M":126,"1Y":252}[range]||126;
  const {vals:data,ts}=getSeries(cur,days);
  const dpr=window.devicePixelRatio||1;
  let w=cv.clientWidth,h=cv.clientHeight;if(w<120)w=900;if(h<120)h=320;
  cv.width=w*dpr;cv.height=h*dpr;
  const ctx=cv.getContext("2d");ctx.scale(dpr,dpr);
  const pad={l:64,r:14,t:14,b:26};
  const min=Math.min(...data)*0.99,max=Math.max(...data)*1.01;
  const X=i=>pad.l+(w-pad.l-pad.r)*i/(data.length-1);
  const Y=v=>pad.t+(h-pad.t-pad.b)*(1-(v-min)/(max-min));
  const up=data[data.length-1]>=data[0];
  const col=up?"#3fb950":"#f85149";
  ctx.strokeStyle="#232b36";ctx.fillStyle="#8b98a5";ctx.font="11px Segoe UI";ctx.textAlign="right";
  for(let g=0;g<=4;g++){const v=min+(max-min)*g/4,y=Y(v);ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText(rp(v),pad.l-8,y+4)}
  const grad=ctx.createLinearGradient(0,pad.t,0,h);grad.addColorStop(0,col+"44");grad.addColorStop(1,col+"05");
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0]));data.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.lineTo(X(data.length-1),h-pad.b);ctx.lineTo(X(0),h-pad.b);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.moveTo(X(0),Y(data[0]));data.forEach((v,i)=>ctx.lineTo(X(i),Y(v)));
  ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.stroke();
  let hov=document.createElement("div");
  hov.style.cssText="position:absolute;pointer-events:none;background:#2f81f7;color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;display:none;z-index:5;white-space:nowrap";
  cv.parentElement.style.position="relative";cv.parentElement.appendChild(hov);
  cv.onmousemove=e=>{const r=cv.getBoundingClientRect();
    const i=Math.round((e.clientX-r.left-pad.l)/(w-pad.l-pad.r)*(data.length-1));
    if(i<0||i>=data.length){hov.style.display="none";return}
    const dd=new Date(ts[i]);
    hov.style.display="block";hov.style.left=Math.min(X(i)+12,r.width-130)+"px";hov.style.top=(Y(data[i])-40)+"px";
    hov.innerHTML=dd.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})+" · <b>"+rp(data[i])+"</b>";};
  cv.onmouseleave=()=>hov.style.display="none";
}

/* =========================================================
   TAB: VALUATION (DCF Builder ala TIKR)
   ========================================================= */
let val={};
function valDefaults(c){
  if(c.valDefaults)return c.valDefaults;
  return c.fin.currency==="USD"?{growth:3,margin:12.2,tax:22,wacc:10,terminal:2.5}:{growth:6.5,margin:24,wacc:11.5,terminal:3.0,tax:22};
}
function tabValuation(el){
  const dv=valDefaults(cur);
  el.innerHTML=`
  <div class="card"><div class="card-h"><h3>DCF Valuation Builder</h3>
    <span class="badge blue">asumsi editable — ala TIKR</span></div>
  <div class="card-b"><div class="val-grid">
    <div>
      <div class="field"><label>Revenue Growth (%/thn, 5 thn)</label><input type="number" id="v-growth" value="${dv.growth}"></div>
      <div class="field"><label>EBITDA Margin (%)</label><input type="number" id="v-margin" value="${dv.margin}"></div>
      <div class="field"><label>Tax Rate (%)</label><input type="number" id="v-tax" value="${dv.tax}"></div>
      <div class="field"><label>WACC / Discount (%)</label><input type="number" id="v-wacc" value="${dv.wacc}"></div>
      <div class="field"><label>Terminal Growth (%)</label><input type="number" id="v-term" value="${dv.terminal}"></div>
      <div class="hint">Model: FCF = EBITDA × (1 − tax) − capex proxy 10% revenue. Nilai ke IDR/share lewat FX ${cur.fx?"US$/IDR "+cur.fx.toLocaleString("id-ID"):"1:1 (laporan Rp)"}.</div>
    </div>
    <div id="val-out"></div>
  </div></div></div>`;
  ["v-growth","v-margin","v-tax","v-wacc","v-term"].forEach(id=>document.getElementById(id).oninput=calcVal);
  calcVal();
}
function calcVal(){
  const dv=valDefaults(cur);
  cur.valDefaults={
    growth:+document.getElementById("v-growth").value||dv.growth,
    margin:+document.getElementById("v-margin").value||dv.margin,
    tax:+document.getElementById("v-tax").value||dv.tax,
    wacc:+document.getElementById("v-wacc").value||dv.wacc,
    terminal:+document.getElementById("v-term").value||dv.terminal};
  const g=cur.valDefaults.growth/100,m=cur.valDefaults.margin/100,w=cur.valDefaults.wacc/100,tg=cur.valDefaults.terminal/100,tx=cur.valDefaults.tax/100;
  const d=derive(cur),f=cur.fin,L=f.years.length-1;
  const isUSD=f.currency==="USD",fx=cur.fx||1,mult=isUSD?1e6:1e12;
  const uLbl=isUSD?(x)=>"US$"+x.toLocaleString("en-US",{maximumFractionDigits:1})+" jt":(x)=>"Rp"+x.toLocaleString("id-ID",{maximumFractionDigits:1})+" T";
  let rev=f.rev[L]*mult,pv=0,rows=[];
  for(let y=1;y<=5;y++){
    rev*=(1+g);
    const ebitda=rev*m;
    const fcf=ebitda*(1-tx)-rev*0.10;
    const disc=fcf/Math.pow(1+w,y);
    pv+=disc;rows.push({y,rev:rev/mult,fcf:fcf/mult,disc:disc/mult});
  }
  const tv=rev*m*(1-tx)/(w-tg);
  const pvTv=tv/Math.pow(1+w,5);
  const ev=pv+pvTv;
  const debt=f.debt&&f.debt[L]!=null?f.debt[L]:null;
  const netDebt=debt!=null?(debt-f.cash[L])*mult:0; // placeholder 0 bila utang tidak lengkap
  const eq=ev-netDebt;
  const perShareLocal=eq/(d.sharesB*1e9); // per share dlm mata uang laporan
  const fv=perShareLocal*(isUSD?fx:1); // IDR/share
  const upside=(fv/cur.price-1)*100;
  document.getElementById("val-out").innerHTML=`
    <div class="fv-box">
      <div class="l">Fair Value per Saham (DCF sederhana)</div>
      <div class="v">${rp(fv)}</div>
      <div>Harga saat ini <b>${rp(cur.price)}</b></div>
      <div style="margin-top:10px"><span class="verdict ${upside>0?"under":"over"}">${upside>0?"▲ UNDERVALUED · potensi +":"▼ OVERVALUED · potensi "}${upside.toFixed(1)}%</span></div>
    </div>
    ${debt==null?`<div style="margin-top:10px;color:var(--gold);font-size:12px">⚠ Net debt memakai placeholder 0 — komponen utang FY terakhir belum lengkap di data sumber.</div>`:""}
    <div class="tbl-wrap" style="margin-top:14px">
    <table><thead><tr><th>Tahun</th><th>Revenue</th><th>FCF</th><th>PV FCF</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>FY${f.years[L]+r.y}E</td><td>${uLbl(r.rev)}</td><td>${uLbl(r.fcf)}</td><td>${uLbl(r.disc)}</td></tr>`).join("")}
    <tr><td><b>Terminal Value (PV)</b></td><td colspan="2"></td><td><b>${uLbl(pvTv/mult)}</b></td></tr>
    <tr><td><b>Enterprise Value</b></td><td colspan="2"></td><td><b>${uLbl(ev/mult)}</b></td></tr>
    <tr><td><b>(−) Net Debt</b></td><td colspan="2"></td><td><b>${debt!=null?uLbl(netDebt/mult):"0 (placeholder)"}</b></td></tr>
    <tr><td><b>Equity Value</b></td><td colspan="2"></td><td><b>${uLbl(eq/mult)}</b></td></tr>
    </tbody></table></div>`;
}

    ${cur.peerBench.map(p=>`<tr><td>${p.nm}</td><td class="tk-bold">${p.tk}</td><td style="color:var(--muted);font-size:12px">${p.seg}</td>
      <td>${p.evebitda!=null?p.evebitda.toFixed(1)+"x":"—"}</td><td>${p.pe!=null?p.pe.toFixed(1)+"x":"—"}</td><td>${p.pb!=null?p.pb.toFixed(1)+"x":"—"}</td></tr>`).join("")}

  </div>`:""}
  ${notAdded.length?`<div class="card"><div class="card-h"><h3>Peer Terkait — Belum Ditambahkan</h3></div><div class="card-b">
    ${notAdded.map(p=>`<div class="peer-chip"><span class="sym">${p.tk}</span><span style="color:var(--muted);font-size:12.5px">${p.nm}</span>
      <button onclick="quickAdd('${p.tk}','${p.nm.replace(/'/g,"")}','${p.sector}')">＋ Tambah</button></div>`).join("")}
    <div style="color:var(--muted);font-size:11.5px;margin-top:6px">Klik "＋ Tambah" untuk memasukkan peer ini ke project — datanya akan terisi otomatis (dummy) dan bisa kamu edit via form Tambah Saham.</div>
  </div></div>`:""}`;
}
function quickAdd(tk,nm,sector){
  const seeds={};
  const base={tk,nm,ex:"IDX",sector,
    price:7000+hashStr(tk)%3000, chg:(hashStr(nm)%40-18)/10, mcap:+(30+hashStr(sector+tk)%160).toFixed(1),
    div:+((hashStr(tk)%30)/10).toFixed(2), beta:+(0.8+(hashStr(nm)%80)/100).toFixed(2),
    desc:"Data dummy yang digenerate otomatis saat saham ini ditambahkan ke project. Edit data ini dengan tombol Tambah Saham bila ada pembaruan.",
    shares:+((30+hashStr(tk)%160)*1e12/(7000+hashStr(tk)%3000)/1e9).toFixed(1)};
  buildFinFrom(base);
  CO.push(base);
  // tandai peer jadi added di semua company
  CO.forEach(c=>c.peers&&c.peers.forEach(p=>{if(p.tk===tk)p.added=true}));
  persist();selectCo(tk);setTab("peers");refreshLive();
}

/* =========================================================
   ADD / EDIT MODAL
   ========================================================= */
function openAddModal(editTk){
  document.getElementById("modal-title").textContent=editTk?"Edit Saham "+editTk:"Tambah Saham";
  document.getElementById("modal-bg").dataset.edit=editTk||"";
  const f=["f-tk","f-nm","f-price","f-mcap","f-div","f-rev","f-margin","f-cagr","f-beta"];
  f.forEach(id=>document.getElementById(id).value="");
  if(editTk){
    const c=CO.find(x=>x.tk===editTk);
    const L=c.fin.years.length-1;
    document.getElementById("f-tk").value=c.tk;
    document.getElementById("f-nm").value=c.nm;
    document.getElementById("f-sector").value=c.sector;
    document.getElementById("f-price").value=c.price;
    document.getElementById("f-mcap").value=c.mcap;
    document.getElementById("f-div").value=c.div||"";
    document.getElementById("f-rev").value=c.fin.rev[L];
    document.getElementById("f-margin").value=(c.fin.ni[L]/c.fin.rev[L]*100).toFixed(1);
    document.getElementById("f-cagr").value=(((c.fin.rev[L]/c.fin.rev[0])**(1/L)-1)*100).toFixed(1);
    document.getElementById("f-beta").value=c.beta||"";
  }
  document.getElementById("modal-bg").classList.add("show");
  document.getElementById("f-tk").focus();
}
function closeModal(){document.getElementById("modal-bg").classList.remove("show")}
function saveNewStock(){
  const tk=document.getElementById("f-tk").value.trim().toUpperCase();
  const price=+document.getElementById("f-price").value;
  if(!tk){alert("Ticker wajib diisi!");return}
  if(!price||price<=0){alert("Harga saham wajib diisi (angka > 0)!");return}
  const editTk=document.getElementById("modal-bg").dataset.edit;
  if(!editTk&&CO.some(c=>c.tk===tk)){alert("Ticker "+tk+" sudah ada di project!");return}
  const nm=document.getElementById("f-nm").value.trim()||tk+".Tbk";
  const mcap=+document.getElementById("f-mcap").value||+(price/1000*50).toFixed(1);
  const div=+document.getElementById("f-div").value||0;
  const rev=+document.getElementById("f-rev").value||+(mcap*0.8).toFixed(1);
  const margin=+document.getElementById("f-margin").value||5;
  const cagr=(+document.getElementById("f-cagr").value||6)/100;
  const beta=+document.getElementById("f-beta").value||1.0;
  const sector=document.getElementById("f-sector").value;
  const co={tk,nm,ex:"IDX",sector,price,chg:+(((hashStr(tk)%60)-25)/10).toFixed(2),mcap,div,beta,
    desc:"Data dummy untuk "+nm+" — ditambahkan manual lewat fitur Tambah Saham. Semua angka financial digenerate dari input kamu.",
    shares:+(mcap*1e12/price/1e9).toFixed(1)};
  buildFinFrom(co,cagr,margin,rev);
  if(editTk){const i=CO.findIndex(x=>x.tk===editTk);CO[i]=co;if(cur&&cur.tk===editTk)cur=co}
  else CO.push(co);
  persist();closeModal();selectCo(tk);refreshLive();
  if(!editTk)setTab("overview");
}
function buildFinFrom(co,cagr,margin,revLast){
  cagr=cagr==null?(hashStr(co.tk)%15)/100:cagr;
  margin=margin==null?5+(hashStr(co.nm)%12):margin;
  revLast=revLast||+(co.mcap*0.8).toFixed(1);
  const ys=[2019,2020,2021,2022,2023];
  const rev=ys.map((y,i)=>+(revLast/Math.pow(1+cagr,4-i)).toFixed(1));
  const ni=rev.map(r=>+(r*margin/100).toFixed(2));
  const fin={currency:"IDR",years:ys,rev,
    gp:rev.map(r=>+(r*0.42).toFixed(1)),
    ebitda:rev.map(r=>+(r*0.26).toFixed(1)),
    da:null,fincost:null,pbt:null,bargain:null,
    ni,niOwners:null,nci:null,eps:null,
    assets:rev.map((r,i)=>+(r*1.9+5).toFixed(1)),
    liab:rev.map((r,i)=>+(r*(1.1+0.03*i)).toFixed(1)),
    eqOwners:null,eqNci:null,
    cash:rev.map(r=>+(r*0.17).toFixed(1)),
    debt:rev.map(r=>+(r*0.42).toFixed(1)),
    ocf:rev.map(r=>+(r*0.22).toFixed(1)),
    capex:rev.map(r=>+(-r*0.07).toFixed(1)),
    fcf:null,
    divpaid:ni.map(n=>+(-n*0.3).toFixed(1)),
    note:null};
  fin.eps=ni.map(n=>+(n*1e12/(co.shares*1e9)).toFixed(0));
  co.fin=fin;
  co.fc={currency:"IDR",years:[2024,2025,2026,2027],
    rev:[],ebitda:null,fcff:null,ni:[],eps:[],
    target:{low:+(co.price*0.85).toFixed(0),avg:+(co.price*1.2).toFixed(0),high:+(co.price*1.5).toFixed(0)},
    ratings:{buy:2,hold:2,sell:1},note:null};
  let r=revLast,g2=cagr*0.6;
  for(let i=0;i<4;i++){r*=(1+g2);co.fc.rev.push(+r.toFixed(1));co.fc.ni.push(+(r*margin/100).toFixed(2))}
  co.fc.eps=co.fc.ni.map(n=>+(n*1e12/(co.shares*1e9)).toFixed(0));
}

/* =========================================================
   INIT

selectCo(CO[0]?CO[0].tk:null);
refreshLive();
